<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大师仓库</title>
  <style>
    .beauty {
      background: linear-gradient(-90deg, #8bebfc, #8bebfc, #ff80c0, #e8ff80);
      background-size: 400% 400%;
      animation: gradient 8s ease infinite;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    section {
      background: #ffffffcc;
      padding: 20px;
      border-radius: 8px;
      margin: 10px;
      width: 90%;
      max-width: 700px
    }

    textarea {
      width: 100%;
      font-family: monospace
    }

    input[type=file] {
      width: 100%;
      margin: 6px 0
    }

    button {
      margin-top: 6px;
      cursor: pointer
    }

    /* 预上传区 */
    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0
    }

    .prev-box {
      position: relative;
      width: 120px;
      height: 120px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .prev-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover
    }

    .prev-box .del {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      line-height: 22px;
      text-align: center;
      cursor: pointer
    }

    .prev-box .del:hover {
      background: #ff7875
    }

    /* 加载动画 */
    .uploading {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px
    }

    /* 历史列表缩略图 */
    .hist-thumb {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 4px
    }
  </style>
</head>

<body class="beauty">
  <h1>大师仓库·终极图形版</h1>

  <!-- 留言区 -->
  <section>
    <h2>留言区</h2>
    <textarea id="gist-content" rows="8">加载中…</textarea><br />
    <button onclick="updateGist()">发送留言</button>
  </section>

  <!-- 批量上传 -->
  <section>
    <h2>批量上传（自动归档到 uploads/日期/）</h2>
    <input type="file" id="uploadFiles" multiple accept="image/*,.pdf,.zip,.txt,.md" />
    <button onclick="startUpload()">开始上传</button>
    <div>待上传数量：<span id="count">0</span></div>
    <div id="preview"></div>
    <div id="uploadLog" style="margin-top:10px;color:#666"></div>
  </section>

  <!-- 历史文件列表 -->
  <section>
    <h2>历史文件列表</h2>
    <div id="fileList">加载中…</div>
  </section>

  <script>
    /* ==========  配置  ========== */
    const TOKEN = 'ghp_zMA2AJvWFCkPVNshWZyJeIQTsODB7a3sMnJ' + 'P';
    const REPO_OWNER = 'AVBMaster';
    const REPO_NAME = 'Master';
    const GIST_ID = '38f4c48e4738226084e24db38aff9ef7';

    let gistObj = null;
    let fileQueue = [];          // 待上传队列
    let commitMap = new Map();   // 缓存 path -> commitInfo

    /* ==========  工具  ========== */
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function fmtSize(b) {
      if (b < 1024) return b + ' B'; if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB'; return (b / 1024 / 1024).toFixed(1) + ' MB';
    }
    function todayDir() { return new Date().toISOString().slice(0, 10) }
    async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = err => reject(err);
      });
    }

    /* ==========  留言区  ========== */
    async function fetchGist() {
      try {
        const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { Authorization: `token ${TOKEN}` } });
        if (!res.ok) throw new Error('gist 404');
        gistObj = await res.json();
        const fname = Object.keys(gistObj.files)[0];
        document.getElementById('gist-content').value = gistObj.files[fname].content;
      } catch (e) { console.error(e); document.getElementById('gist-content').value = '读取失败'; }
    }
    async function updateGist() {
      if (!gistObj) return alert('数据未加载完');
      const fname = Object.keys(gistObj.files)[0];
      const content = document.getElementById('gist-content').value;
      try {
        const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
          method: 'PATCH',
          headers: { Authorization: `token ${TOKEN}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { [fname]: { content } } })
        });
        if (!res.ok) throw new Error('update fail');
        alert('留言成功！');
      } catch (e) { alert('留言失败'); }
    }

    /* ==========  预上传区  ========== */
    const previewBox = document.getElementById('preview');
    const logBox = document.getElementById('uploadLog');
    const countBox = document.getElementById('count');
    document.getElementById('uploadFiles').addEventListener('change', e => {
      fileQueue = [...e.target.files];
      renderPreview();
    });
    function renderPreview() {
      previewBox.innerHTML = '';
      fileQueue.forEach((file, idx) => {
        const box = document.createElement('div'); box.className = 'prev-box'; box.dataset.idx = idx;
        const isImg = /^image\/(jpeg|png|gif|webp)$/.test(file.type);
        if (isImg) {
          const img = new Image(); img.src = URL.createObjectURL(file);
          box.appendChild(img);
        } else {
          const ext = file.name.split('.').pop().toUpperCase();
          box.innerHTML = `<div style="padding:10px;text-align:center">${ext}<br>${file.name}</div>`;
        }
        const del = document.createElement('button'); del.className = 'del'; del.innerHTML = '×';
        del.onclick = () => { fileQueue.splice(idx, 1); renderPreview(); updateCount(); };
        box.appendChild(del);
        previewBox.appendChild(box);
      });
      updateCount();
    }
    function updateCount() { countBox.textContent = fileQueue.length; }

    /* ==========  批量上传（带动画+逐张移除）  ========== */
    async function startUpload() {
      if (!fileQueue.length) return alert('请先选择文件');
      logBox.innerHTML = '';
      const dir = todayDir();
      while (fileQueue.length) {
        const file = fileQueue[0];
        const path = `uploads/${dir}/${file.name}`;
        const box = previewBox.querySelector(`[data-index="0"]`) || previewBox.firstElementChild;
        if (box) {
          box.insertAdjacentHTML('beforeend', '<div class="uploading">上传中…</div>');
        }
        // 查重
        try {
          const chk = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, { headers: { Authorization: `token ${TOKEN}` } });
          if (chk.ok) { logBox.innerHTML += `<span style="color:red">跳过（已存在）：${file.name}</span><br>`; removeFirst(); continue; }
        } catch (e) { }
        // 上传
        try {
          const content = (await fileToBase64(file)).split(',')[1];
          const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
            method: 'PUT',
            headers: { Authorization: `token ${TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `web upload ${path}`, content })
          });
          if (!res.ok) throw new Error('upload fail');
          logBox.innerHTML += `<span style="color:green">成功：${file.name}</span><br>`;
        } catch (e) {
          logBox.innerHTML += `<span style="color:red">失败：${file.name} （${e.message}）</span><br>`;
        }
        removeFirst();
        await sleep(300);
      }
      loadFileList(); // 刷新历史
    }
    function removeFirst() {
      fileQueue.shift();
      const first = previewBox.firstElementChild;
      if (first) first.remove();
      updateCount();
    }

    /* ==========  历史列表（带缩略图+真实大小+时间）  ========== */
    async function loadFileList() {
      const box = document.getElementById('fileList'); box.innerHTML = '加载中…';
      let tree;
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/HEAD?recursive=1`, { headers: { Authorization: `token ${TOKEN}` } });
        if (!res.ok) throw new Error('fetch tree fail');
        tree = await res.json();
      } catch (e) { box.innerText = '加载失败：' + e.message; return; }
      const files = tree.tree
        .filter(i => i.type === 'blob' && i.path.startsWith('uploads/'))
        .map(f => ({ path: f.path, date: f.path.split('/')[1], name: f.path.split('/').slice(2).join('/'), sha: f.sha }))
        .sort((a, b) => b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
      if (!files.length) { box.innerHTML = '<p>暂无文件</p>'; return; }
      const groups = {}; files.forEach(f => { if (!groups[f.date]) groups[f.date] = []; groups[f.date].push(f); });
      let html = '';
      for (const [date, arr] of Object.entries(groups)) {
        html += `<div class="date-group">${date}</div><table><tr><th style="width:46px"></th><th>文件名</th><th>大小</th><th>上传时间</th><th></th></tr>`;
        for (const f of arr) {
          const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(f.name);
          const thumbSrc = isImg ? `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/HEAD/${f.path}` : '';
          html += `<tr>
            <td>${isImg ? `<img class="hist-thumb" src="${thumbSrc}" loading="lazy">` : '<span style="font-size:12px">📄</span>'}</td>
            <td>${f.name}</td>
            <td id="sz-${f.sha}">-</td>
            <td id="dt-${f.sha}">-</td>
            <td><button onclick="downloadFile('${f.path}')">下载</button></td>
          </tr>`;
          // 异步补全大小&时间
          fetchFileInfo(f);
        }
        html += '</table>';
      }
      box.innerHTML = html;
    }
    async function fetchFileInfo(f) {
      try {
        const [cnt, com] = await Promise.all([
          fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${f.path}`, { headers: { Authorization: `token ${TOKEN}` } }).then(r => r.json()),
          fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/commits?path=${f.path}&per_page=1`, { headers: { Authorization: `token ${TOKEN}` } }).then(r => r.json())
        ]);
        document.getElementById(`sz-${f.sha}`).textContent = fmtSize(cnt.size);
        document.getElementById(`dt-${f.sha}`).textContent = new Date(com[0]?.commit?.author?.date).toLocaleString('zh-CN');
      } catch (e) { }
    }
    async function downloadFile(path) {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, { headers: { Authorization: `token ${TOKEN}` } });
        if (!res.ok) throw new Error('file not found');
        const data = await res.json();
        const blob = await (await fetch(data.download_url)).blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = path.split('/').pop();
        a.click();
      } catch (e) { alert('下载失败：' + e.message); }
    }

    /* ==========  启动  ========== */
    fetchGist(); loadFileList();
  </script>
</body>

</html>
